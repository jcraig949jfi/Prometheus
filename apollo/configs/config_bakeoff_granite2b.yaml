# ============================================================
# APOLLO bake-off candidate: Qwen-7B + Phi-4-mini (2026-05-19)
# ============================================================
# Same architecture as config_v2d2b.yaml; only the alt-LLM slot
# and run dirs differ.

apollo:
  island_id: "bakeoff-granite2b"
  instance_name: "Apollo bake-off (Granite-3.0-2B alt @ 50%)"

  primitives_dir: "agents/hephaestus/src"
  trap_generator: "agents/hephaestus/src/trap_generator.py"
  gem_dirs:
    - "agents/hephaestus/forge_v9/*.py"
    - "forge/candidates/*gem*.py"
    - "agents/hephaestus/forge_v7/*specialist*.py"

  log_dir: "run_v2d2b_granite2b/logs"
  checkpoint_dir: "run_v2d2b_granite2b/checkpoints"
  lineage_dir: "run_v2d2b_granite2b/lineage"
  graveyard_dir: "run_v2d2b_granite2b/graveyard"
  dashboard_dir: "run_v2d2b_granite2b/dashboard"

  shared_pool: "\\\\SKULLPORT\\skullport_shared\\apollo_pool"

  population_size: 50
  offspring_per_generation: 50
  elite_count: 5

  mutation_rates:
    route: 0.20
    parameter: 0.25
    wiring: 0.35
    swap: 0.20
  drift_sigma: 0.02
  crossover_rate: 0.3

  warmup_generations: 50
  accuracy_activation_gen: 50
  ablation_activation_gen: 100
  params_only_until_gen: 50

  selection_algorithm: "nsga3"
  fitness_objectives: 6

  ncd_min_differ: 3

  ablation_interval: 5
  ablation_threshold: 0.20

  novelty_k_nearest: 15
  novelty_archive_threshold: 0.3
  novelty_archive_max_size: 500

  n_reference_tasks: 50
  n_evolution_tasks: 100
  n_held_out_tasks: 50
  rotation_count: 10
  task_rotation_interval: 50
  quick_screen_count: 3

  sandbox_timeout_seconds: 0.5

  llm_model: "Qwen/Qwen2.5-Coder-7B-Instruct"
  llm_device: "cuda"
  llm_max_tokens: 512
  llm_temperature: 0.7
  llm_load_in_8bit: true

  checkpoint_interval: 10
  checkpoint_keep_last: 5
  held_out_eval_interval: 10
  max_generations: 1511  # bake-off slice: 20 gens from checkpoint 1490 (Phi confirmed faster signal at 5 gens)

  annealing_rounds: 10
  aos_accuracy_only_until: 300

  # Bake-off alt LLM (2026-05-19): second local HTTP server hosting Phi-4-mini
  alt_llm_url: ""
  alt_llm_ratio: 0.0

  # DeepSeek depleted; ratio=0 disables
  deepseek_api_key: ""
  deepseek_ratio: 0.0
  deepseek_model: "deepseek-chat"

# ============================================================
# APOLLO v2_d2b — Granite-3.0-2B production (post-bakeoff 2026-05-19)
# ============================================================
# Bake-off (2026-05-19) compared 4 mutation LLMs against Apollo's code
# validator. Granite-3.0-2B-Instruct produced 30x more LLM-successful
# mutations per gen than Qwen-7B-Coder (the canonical model), with a 61%
# route-mutation validation rate vs Qwen's 1%. Wall-clock per gen is ~50x
# slower, but per-hour meaningful-mutation rate is ~7x higher.
#
# Apollo's primary LLM at port 8800 is now Granite (via llm_server_alt.py).
# This config continues the production lineage in run_v2d2b/ from the
# latest checkpoint (gen 1770 as of 2026-05-20).
#
# llm_model below is COSMETIC — actual model is whatever is hosted at the
# server URL Apollo connects to. We keep the field for log compatibility.

apollo:
  island_id: "beta-v2d2b-granite"
  instance_name: "Apollo-Beta v2d2b (Granite-2B post-bakeoff)"

  primitives_dir: "agents/hephaestus/src"
  trap_generator: "agents/hephaestus/src/trap_generator.py"
  gem_dirs:
    - "agents/hephaestus/forge_v9/*.py"
    - "forge/candidates/*gem*.py"
    - "agents/hephaestus/forge_v7/*specialist*.py"

  log_dir: "run_v2d2b/logs"
  checkpoint_dir: "run_v2d2b/checkpoints"
  lineage_dir: "run_v2d2b/lineage"
  graveyard_dir: "run_v2d2b/graveyard"
  dashboard_dir: "run_v2d2b/dashboard"

  shared_pool: "\\\\SKULLPORT\\skullport_shared\\apollo_pool"

  population_size: 50
  offspring_per_generation: 50
  elite_count: 5

  mutation_rates:
    route: 0.20
    parameter: 0.25
    wiring: 0.35
    swap: 0.20
  drift_sigma: 0.02
  crossover_rate: 0.3

  warmup_generations: 50
  accuracy_activation_gen: 50
  ablation_activation_gen: 100
  params_only_until_gen: 50

  selection_algorithm: "nsga3"
  fitness_objectives: 6

  ncd_min_differ: 3

  ablation_interval: 5
  ablation_threshold: 0.20

  novelty_k_nearest: 15
  novelty_archive_threshold: 0.3
  novelty_archive_max_size: 500

  n_reference_tasks: 50
  n_evolution_tasks: 100
  n_held_out_tasks: 50
  rotation_count: 10
  task_rotation_interval: 50
  quick_screen_count: 3

  sandbox_timeout_seconds: 0.5

  # Cosmetic — actual model is determined by what runs at the URL Apollo
  # connects to at port 8800. We host Granite via llm_server_alt.py.
  llm_model: "ibm-granite/granite-3.0-2b-instruct"
  llm_device: "cuda"
  llm_max_tokens: 512
  llm_temperature: 0.7
  llm_load_in_8bit: true

  checkpoint_interval: 10
  checkpoint_keep_last: 5
  held_out_eval_interval: 10
  max_generations: 50000

  annealing_rounds: 10
  aos_accuracy_only_until: 300

  # No alt LLM in production — single Granite on the 16GB GPU
  alt_llm_url: ""
  alt_llm_ratio: 0.0
  deepseek_api_key: ""
  deepseek_ratio: 0.0
  deepseek_model: "deepseek-chat"

name: Deploy docs/ to GitHub Pages

# Replaces the auto-generated Pages workflow (which fails because the repo
# has an orphan submodule gitlink at cartography/mathlib/mathlib4_source
# with no .gitmodules entry). This workflow checks out without recursing
# submodules, then publishes docs/ verbatim.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # GitHub's stock Pages template sets this false, so a deploy is never cut off
  # mid-flight. That assumes runs always finish. On 2026-08-31 a deployment stuck
  # in "waiting" never did, and because nothing could cancel it, all 29 runs after
  # it queued behind the wedge, were never assigned a job, and died at the timeout
  # -- the published site sat three weeks stale while every push appeared to work.
  # true trades "a deploy can be superseded by a newer one" for "one stuck run
  # cannot freeze the site indefinitely". Superseding is the cheaper failure: the
  # newer push is the one we wanted published anyway.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

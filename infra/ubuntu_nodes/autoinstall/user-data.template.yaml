#cloud-config
# Ubuntu Server autoinstall for Prometheus swarm nodes (ubuNNN). Template: no secrets in git.
# build_cidata.py fills the @@...@@ placeholders from local secret files and writes
# user-data + meta-data to a FAT32 USB stick labelled CIDATA. See README.md in this folder.
#
# Safety: the config is on a SEPARATE stick (not the kernel command line), so the installer still asks
# "Continue with autoinstall? (yes|no)" once before it erases the disk. Type yes + Enter.
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Etc/UTC

  # Wired port and Wi-Fi are both configured, so it works whichever the machine has.
  # Wired uses match (interface names differ per laptop: eno1, enp0s31f6, ...); Wi-Fi uses early-commands (below).
  network:
    version: 2
    ethernets:
      wired:
        match:
          name: "en*"
        dhcp4: true
        optional: true
    wifis:
      # netplan's networkd backend refuses `match:` for Wi-Fi ("does not support wifi with match rules"),
      # so early-commands swaps in the real interface name (wlp2s0, wlp4s0, ...) before the network is set up.
      __WIFI_IFACE__:
        dhcp4: true
        optional: true
        access-points:
          @@WIFI_SSID@@:
            password: @@WIFI_PASSWORD@@

  # Runs first. The installer re-reads /autoinstall.yaml after early-commands, so this edit takes effect.
  # No Wi-Fi card: the placeholder becomes "wlan-none" (optional, so it's ignored).
  early-commands:
    # SAFETY (P52s 2026-10-03): with no internal disk visible, "largest disk" chose the 32 GB CIDATA USB stick and
    # installed Ubuntu onto it. Never choose by size again: pick the largest NON-USB disk of at least 60 GB and pin
    # the install to that exact device (storage.layout.match.path below), or refuse before storage is touched.
    - "D=$(lsblk -dbno NAME,TRAN,SIZE,TYPE | awk '$4==\"disk\" && $2!=\"usb\" && $3>=60000000000 {print $3, $1}' | sort -n | tail -n1 | cut -d' ' -f2); if [ -z \"$D\" ]; then echo 'AUTOINSTALL REFUSED: no internal (non-USB) disk >= 60 GB visible; check the drive / BIOS' > /dev/console; exit 1; fi; sed -i \"s#__TARGET_DISK__#/dev/$D#\" /autoinstall.yaml; echo \"autoinstall target: /dev/$D\" > /dev/console"
    - "IF=$(ls /sys/class/net | grep '^wl' | head -n1); sed -i \"s/__WIFI_IFACE__/${IF:-wlan-none}/\" /autoinstall.yaml"

  # Whole internal disk, LVM, root LV uses ALL the space (no 100 GB default; no lvextend needed later).
  # No passphrase. The target is pinned to the internal disk by early-commands, so USB drives are never chosen.
  storage:
    layout:
      name: lvm
      sizing-policy: all
      match:
        path: __TARGET_DISK__        # filled in by the first early-command: the largest non-USB disk, never a stick

  # Every node starts as ubu-new; Achilles renames it (hostnamectl) after the first SSH login.
  identity:
    hostname: ubu-new
    realname: James Craig
    username: jcraig
    password: @@PASSWORD_HASH@@

  ssh:
    install-server: true
    allow-pw: true
    authorized-keys:
@@AUTHORIZED_KEYS@@

  # Only packages that install from the installer stick itself, so the install never depends on a download
  # (P52s 2026-10-03: `iw` was not on the stick and failed with apt exit 100 without a network, killing the
  # install). iw, gh, jq, python3-venv and python3-pip are installed by ubuntu_server_setup.sh afterwards.
  packages:
    - git
    - curl
    - htop
    - tmux
    - wpasupplicant

  updates: all
  # poweroff, not reboot (Inspiron 2026-10-03): with the sticks still in, a reboot boots the installer again and a
  # second 'yes' reinstalls -- it looped four times. Power off; pull the sticks; power on into the new system.
  shutdown: poweroff

  late-commands:
    - "echo 'jcraig ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/jcraig"
    - "chmod 440 /target/etc/sudoers.d/jcraig"
    - "mkdir -p /target/etc/systemd/logind.conf.d"
    - "printf '[Login]\\nHandleLidSwitch=ignore\\nHandleLidSwitchExternalPower=ignore\\nHandleLidSwitchDocked=ignore\\n' > /target/etc/systemd/logind.conf.d/10-server-lid.conf"
    - "curtin in-target -- loginctl enable-linger jcraig || true"
